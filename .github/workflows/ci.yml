name: verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check notices
        run: python3 scripts/check_headers.py
      - name: C regression tests and sanitizers
        run: |
          make test CC=clang CFLAGS='-O1 -g -Wall -Wextra -Werror -std=c11 -UNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer'
      - name: Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - name: Rust checks
        run: |
          cargo +1.85.1 fmt --manifest-path rust/tensor-hw/Cargo.toml --check
          cargo +1.85.1 test --locked --manifest-path rust/tensor-hw/Cargo.toml --all-targets --all-features
          cargo +1.85.1 test --locked --release --manifest-path rust/tensor-hw/Cargo.toml
          cargo +1.85.1 clippy --locked --manifest-path rust/tensor-hw/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile formal model
        working-directory: formal
        run: lake build
      - name: Proof admission check
        run: python3 scripts/check_proofs.py
